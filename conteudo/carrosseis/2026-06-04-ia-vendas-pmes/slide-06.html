<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Slide 06 — Virada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 80px;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .tag {
    font-size: 16px; font-weight: 600; letter-spacing: 3px;
    color: #00ff88; text-transform: uppercase; margin-bottom: 48px;
    position: relative;
  }
  .accent-line {
    width: 64px; height: 4px; background: #00ff88; margin: 0 auto 48px;
    border-radius: 2px; position: relative;
  }
  h2 {
    font-size: 60px; font-weight: 800; color: #ffffff; line-height: 1.2;
    margin-bottom: 48px; position: relative;
  }
  h2 span { color: #00ff88; }
  .conclusion {
    font-size: 26px; font-weight: 400; color: rgba(255,255,255,0.65);
    line-height: 1.6; max-width: 780px; position: relative;
    margin-bottom: 56px;
  }
  .conclusion strong { color: #ffffff; font-weight: 700; }
  .insight-box {
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.25);
    border-radius: 16px;
    padding: 32px 56px;
    position: relative;
  }
  .insight-box p {
    font-size: 24px; font-weight: 600; color: #00ff88; line-height: 1.5;
  }
  .brand {
    position: absolute; bottom: 44px; right: 60px;
    font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.25);
  }
  .slide-num {
    position: absolute; bottom: 44px; left: 60px;
    font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="tag">A virada</div>
  <div class="accent-line"></div>
  <h2>IA não é vantagem<br>de grande empresa.<br><span>É vantagem de quem age primeiro.</span></h2>
  <p class="conclusion">PME que adota IA agora <strong>não precisa crescer o time</strong> para crescer o faturamento. A tecnologia niveala o campo — mas só pra quem usa.</p>
  <div class="insight-box">
    <p>Cada semana que passa sem automação<br>é receita deixada na mesa.</p>
  </div>
  <div class="slide-num">06 / 07</div>
  <div class="brand">Indite</div>
</body>
</html>
